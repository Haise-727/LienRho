name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1
  ECR_REPO: lienrho-web
  CLUSTER: lienrho-cluster
  SERVICE: lienrho-web
  MIGRATE_TASK: lienrho-migrate

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, migrate, deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account=$AWS_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push image
        env:
          SHA: ${{ github.sha }}
        run: |
          URI="${{ steps.ecr.outputs.account }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO"
          docker build -t "$URI:latest" -t "$URI:$SHA" .
          docker push "$URI:latest"
          docker push "$URI:$SHA"

      # Run prisma migrate deploy INSIDE the VPC so the private Aurora is reachable.
      - name: Run database migrations
        run: |
          SUBNETS=$(aws ecr describe-repositories >/dev/null 2>&1; \
            aws ec2 describe-subnets --filters Name=tag:Name,Values='lienrho-private-*' \
              --query 'Subnets[*].SubnetId' --output text | tr '\t' ',')
          SG=$(aws ec2 describe-security-groups --filters Name=group-name,Values='lienrho-web-sg' \
            --query 'SecurityGroups[0].GroupId' --output text)

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$MIGRATE_TASK" \
            --launch-type FARGATE \
            --count 1 \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
          aws logs tail "/ecs/lienrho-web" --since 15m --output text || true

      - name: Force new deployment
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment
